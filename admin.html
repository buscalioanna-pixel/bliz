<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bliz - Panel Modo Dios (Admin)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        h1 { color: #f43f5e; font-size: 1.5rem; }
        .filters { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; font-size: 0.9rem; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #334155; color: #38bdf8; }
        button { background: #f43f5e; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background: #e11d48; }
        .admin-container { display: flex; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
        .video-box { background: #1e293b; padding: 15px; border-radius: 12px; }
        video { width: 320px; height: 240px; background: #000; border-radius: 8px; object-fit: cover; }
        
        /* Pantalla de Login */
        #loginOverlay { position: fixed; inset: 0; background: #0f172a; display: flex; align-items: center; justify-content: center; z-index: 999; }
        .login-card { background: #1e293b; padding: 25px; border-radius: 12px; text-align: center; border: 1px solid #334155; width: 300px; }
        .login-card input { width: 100%; padding: 10px; margin: 15px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; text-align: center; box-sizing: border-box; }
    </style>
</head>
<body>

    <!-- BLOQUE DE AUTENTICACIÓN -->
    <div id="loginOverlay">
        <div class="login-card">
            <h2>⚡ Acceso Admin</h2>
            <p style="font-size: 0.8rem; color: #94a3b8;">Introduce la clave para acceder al Modo Dios</p>
            <input type="password" id="adminPassword" placeholder="Contraseña">
            <button onclick="checkPassword()" style="width: 100%; py: 10px;">Entrar</button>
        </div>
    </div>

    <h1>⚡ Panel de Control - Modo Dios (Admin)</h1>

    <div class="filters">
        <div>
            <label>Género:</label>
            <select id="filter-gender" onchange="loadActiveUsers()" style="padding: 5px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: white;">
                <option value="">Todos</option>
                <option value="MALE">Masculino</option>
                <option value="FEMALE">Femenino</option>
                <option value="GROUP">Grupo</option>
            </select>
        </div>
        <div>
            <label>País:</label>
            <input type="text" id="filter-country" placeholder="Ej: ES" onkeyup="loadActiveUsers()" style="padding: 5px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: white;">
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Peer ID</th>
                <th>Género</th>
                <th>País</th>
                <th>Última Actividad</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody id="users-table-body">
            <tr><td colspan="5" style="text-align: center;">Cargando usuarios activos...</td></tr>
        </tbody>
    </table>

    <div class="admin-container">
        <div class="video-box">
            <h3>Cámara Admin</h3>
            <video id="admin-local" autoplay muted playsinline></video>
        </div>
        <div class="video-box">
            <h3>Vídeo del Usuario Intervenido</h3>
            <video id="admin-remote" autoplay playsinline></video>
        </div>
    </div>

    <script>
        // CONTRASEÑA DE ACCESO AL PANEL (Cámbiala aquí si quieres)
        const SECRET_PASS = "admin1234";

        const SUPABASE_URL = 'https://zcdgnzbegusizsxozfrr.supabase.co';
        const SUPABASE_KEY = 'TU_PUBLISHABLE_KEY_AQUI'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let peer = null;
        let adminStream = null;

        function checkPassword() {
            const input = document.getElementById('adminPassword').value;
            if (input === SECRET_PASS) {
                document.getElementById('loginOverlay').style.display = 'none';
                startAdminPanel();
            } else {
                alert("Contraseña incorrecta");
            }
        }

        async function startAdminPanel() {
            await initAdminMedia();
            initAdminPeer();
            loadActiveUsers();
            setInterval(loadActiveUsers, 5000);
        }

        async function initAdminMedia() {
            try {
                adminStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('admin-local').srcObject = adminStream;
            } catch (err) {
                console.error("Error al inicializar los medios del administrador:", err);
                alert("Permite el uso de cámara y micrófono para poder realizar llamadas de intervención.");
            }
        }

        function initAdminPeer() {
            peer = new Peer();
            peer.on('error', (err) => {
                console.error("Error en PeerJS del Admin:", err);
            });
        }

        async function loadActiveUsers() {
            let query = supabaseClient.from('active_users').select('*');

            const gender = document.getElementById('filter-gender').value;
            const country = document.getElementById('filter-country').value.trim();

            if (gender) query = query.eq('gender', gender);
            if (country) query = query.ilike('country', `%${country}%`);

            const { data, error } = await query;
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = '';

            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #f43f5e;">Error al consultar la base de datos.</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center;">No hay usuarios activos en este momento.</td></tr>`;
                return;
            }

            data.forEach(user => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${user.id.substring(0, 8)}...</td>
                    <td>${user.gender}</td>
                    <td>${user.country}</td>
                    <td>${new Date(user.updated_at).toLocaleTimeString()}</td>
                    <td><button onclick="interveneUser('${user.id}')">📞 Intervenir</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function interveneUser(targetId) {
            if (!adminStream) {
                alert("La cámara del administrador no está lista todavía.");
                return;
            }

            console.log(`Iniciando intervención con el usuario: ${targetId}`);
            const call = peer.call(targetId, adminStream);

            call.on('stream', (remoteStream) => {
                document.getElementById('admin-remote').srcObject = remoteStream;
            });

            call.on('error', (err) => {
                console.error("Error en la llamada de intervención:", err);
                alert("No se pudo conectar con el usuario.");
            });
        }
    </script>
</body>
</html>
