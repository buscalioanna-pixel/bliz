<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bliz - Panel de Administración</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0B0F19] text-white min-h-screen flex flex-col">

<!-- PANTALLA DE LOGIN -->
<div id="loginScreen" class="fixed inset-0 bg-[#0B0F19] z-50 flex items-center justify-center p-4">
  <div class="w-full max-w-sm bg-gray-900 border border-gray-800 rounded-2xl p-6 flex flex-col gap-4 shadow-2xl text-center">
    <h2 class="text-xl font-bold bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent">🔒 God Mode - Bliz</h2>
    <p class="text-xs text-gray-400">Introduce la contraseña de administración</p>
    <input type="password" id="adminPasswordInput" placeholder="Contraseña..." class="w-full p-2.5 rounded-xl border border-gray-700 bg-gray-950 text-white text-sm outline-none focus:border-cyan-500">
    <button onclick="checkAdminLogin()" class="w-full py-2.5 rounded-xl font-bold text-white bg-gradient-to-r from-purple-600 to-cyan-500 hover:opacity-90 transition cursor-pointer text-xs">Entrar al Panel</button>
  </div>
</div>

<!-- CONTENIDO DEL PANEL DE ADMIN -->
<div id="adminContent" class="hidden flex-1 flex flex-col p-4 max-w-4xl mx-auto w-full">
  <header class="flex justify-between items-center py-4 border-b border-gray-800 mb-4">
    <h1 class="text-lg font-bold text-cyan-400">⚡ Panel de Control</h1>
    <button onclick="location.reload()" class="px-3 py-1 bg-red-600/80 hover:bg-red-700 text-xs font-semibold rounded-lg transition cursor-pointer">Cerrar Sesión</button>
  </header>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 flex flex-col gap-2">
      <h3 class="text-sm font-bold text-gray-300">👥 Usuarios Activos en Línea</h3>
      <div id="activeUsersList" class="text-xs text-gray-400 flex flex-col gap-1 max-h-60 overflow-y-auto">
        Cargando usuarios...
      </div>
    </div>

    <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 flex flex-col gap-2">
      <h3 class="text-sm font-bold text-gray-300">🛡️ Estado del Sistema</h3>
      <p class="text-xs text-gray-400">Base de datos conectada correctamente a Supabase.</p>
      <p class="text-xs text-emerald-400 font-semibold">● Servidor P2P Activo</p>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://zcdgnzbegusizsxozfrr.supabase.co';
const SUPABASE_KEY = 'TU_PUBLISHABLE_KEY_AQUI'; 
const supabaseClient = typeof supabase !== 'undefined' ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

async function checkAdminLogin() {
    const inputPass = document.getElementById('adminPasswordInput').value;
    
    if (!supabaseClient) {
        alert("Error de conexión con Supabase.");
        return;
    }

    // Consultar la contraseña segura desde la base de datos
    const { data, error } = await supabaseClient
        .from('admin_config')
        .select('password')
        .eq('id', 1)
        .single();

    if (error || !data) {
        alert("Error al verificar la contraseña en el servidor.");
        return;
    }

    if (inputPass === data.password) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('adminContent').style.display = 'flex';
        loadActiveUsers();
    } else {
        alert("Contraseña incorrecta.");
    }
}

async function loadActiveUsers() {
    if (!supabaseClient) return;
    const { data, error } = await supabaseClient.from('active_users').select('*');
    const container = document.getElementById('activeUsersList');
    
    if (error) {
        container.innerHTML = "Error al cargar usuarios.";
        return;
    }

    if (!data || data.length === 0) {
        container.innerHTML = "No hay usuarios activos en este momento.";
        return;
    }

    container.innerHTML = data.map(u => `
        <div class="flex justify-between items-center bg-gray-950 p-2 rounded-lg border border-gray-800">
          <span class="font-mono text-[10px]">ID: ${u.id.substring(0, 10)}...</span>
          <span class="text-cyan-400">País: ${u.country || 'GLOBAL'}</span>
        </div>
    `).join('');
}
</script>
</body>
</html>
