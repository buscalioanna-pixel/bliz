<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bliz - Videochat</title>
    <style>
        body { background: #0f1020; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1a1a2e; padding: 25px; border-radius: 12px; text-align: center; width: 90%; max-width: 350px; border: 1px solid #333; }
        input { width: 80%; padding: 12px; margin: 10px 0; background: #0f1020; border: 1px solid #444; color: #fff; border-radius: 8px; text-align: center; font-size: 16px; }
        button { width: 100%; padding: 12px; margin-top: 10px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #chatScreen { display: none; text-align: center; }
        video { width: 100%; max-height: 300px; background: #000; border-radius: 8px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <!-- Pantalla de Verificación -->
    <div class="card" id="ageScreen">
        <h2>BLIZ</h2>
        <p>Introduce tu año de nacimiento (+18)</p>
        <input type="number" id="ageInput" placeholder="Ej. 2000">
        <button onclick="verificarEdad()">Entrar</button>
    </div>

    <!-- Pantalla de Videochat -->
    <div class="card" id="chatScreen">
        <h2>BLIZ - Sala en Directo</h2>
        <video id="localVideo" autoplay playsinline muted></video>
        <button onclick="siguienteUsuario()" style="background: #ef4444;">Siguiente</button>
    </div>

    <script>
        function verificarEdad() {
            const anio = document.getElementById('ageInput').value;
            if (2026 - anio >= 18) {
                document.getElementById('ageScreen').style.display = 'none';
                document.getElementById('chatScreen').style.display = 'block';
                iniciarCamara();
            } else {
                alert('Debes ser mayor de edad para acceder.');
            }
        }

        async function iniciarCamara() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = stream;
            } catch (err) {
                console.error("Error al acceder a la cámara:", err);
            }
        }

        function siguienteUsuario() {
            alert('Buscando siguiente usuario...');
        }
    </script>
</body>
</html>
