<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bliz - Video Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; margin: 0; padding: 10px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        h2 { margin: 10px 0; font-size: 1.2rem; }
        .container { display: flex; flex: 1; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; }
        .video-box { background: #1e293b; padding: 10px; border-radius: 12px; position: relative; width: 45%; min-width: 280px; height: 60vh; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; background: #000; border-radius: 8px; object-fit: cover; }
        .label { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 4px; font-size: 0.9rem; }
        .controls { padding: 15px; }
        button { background: #10b981; color: white; border: none; padding: 12px 25px; font-size: 1rem; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #059669; }
    </style>
</head>
<body>
    <h2>Bliz Video Chat</h2>
    
    <div class="container">
        <div class="video-box">
            <video id="local-video" autoplay muted playsinline></video>
            <div class="label">Tú</div>
        </div>
        <div class="video-box">
            <video id="remote-video" autoplay playsinline></video>
            <div id="loader" class="label">🔍 Buscando...</div>
        </div>
    </div>

    <div class="controls">
        <button onclick="buscarPersona()">⏭️ Siguiente</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://zcdgnzbegusizsxozfrr.supabase.co';
        const SUPABASE_KEY = 'TU_PUBLISHABLE_KEY_AQUI'; // Pega aquí tu clave real de Supabase
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let localStream, peer, myPeerId;

        async function init() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video').srcObject = localStream;
            } catch (e) {
                alert("Debes permitir el uso de la cámara y el micrófono.");
            }

            peer = new Peer();
            peer.on('open', (id) => {
                myPeerId = id;
                buscarPersona();
            });

            peer.on('call', (call) => {
                call.answer(localStream);
                call.on('stream', (remoteStream) => {
                    document.getElementById('remote-video').srcObject = remoteStream;
                    document.getElementById('loader').style.display = 'none';
                });
            });
        }

        async function buscarPersona() {
            document.getElementById('remote-video').srcObject = null;
            document.getElementById('loader').style.display = 'block';

            if (myPeerId) {
                await supabaseClient.from('active_users').upsert({
                    id: myPeerId,
                    gender: 'male',
                    country: 'ES',
                    updated_at: new Date()
                });
            }
        }

        window.addEventListener('beforeunload', () => {
            if (myPeerId) supabaseClient.from('active_users').delete().eq('id', myPeerId);
        });

        window.onload = init;
    </script>
</body>
</html>
