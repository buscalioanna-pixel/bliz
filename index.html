<!DOCTYPE html>
<html lang="es">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0F19">
<title>Bliz - Videochat Global</title>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- PeerJS -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
html, body { 
  background-color: #0B0F19; 
  color: #ffffff; 
  height: 100dvh; 
  width: 100vw; 
  display: flex; 
  flex-direction: column; 
  overflow: hidden; 
  touch-action: manipulation; 
}
.beauty-active { filter: brightness(1.12) contrast(1.05) saturate(1.1) blur(0.3px); }
.floating-emoji {
  position: absolute; bottom: 70px; right: 24px; font-size: 32px;
  animation: floatUp 1.8s ease-out forwards; z-index: 30; pointer-events: none;
}
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-130px) scale(1.5); }
}
@keyframes slideDown {
  0% { transform: translateY(-100%); opacity: 0; }
  100% { transform: translateY(0); opacity: 1; }
}
.animate-slide-down {
  animation: slideDown 0.3s ease-out forwards;
}
#chatInput { user-select: text; }
</style>
</head>
<body class="flex flex-col h-[100dvh] w-full bg-[#0B0F19]">

<!-- BANNER DE ALERTA DE MODERACIÓN -->
<div id="modBanner" class="hidden fixed top-0 left-0 right-0 z-50 bg-red-600/95 text-white text-xs px-4 py-2.5 text-center font-bold shadow-lg backdrop-blur animate-slide-down flex items-center justify-center gap-2">
  <span>⚠️</span> <span id="modBannerText">Aviso de Moderación: Comportamiento inadecuado detectado.</span>
</div>

<!-- PANTALLA INICIAL (+18 Y TÉRMINOS) -->
<div id="authScreen" class="fixed inset-0 bg-[#0B0F19] z-50 flex items-center justify-center p-4">
  <div class="w-full max-w-xs bg-gray-900 border border-gray-800 rounded-3xl p-5 flex flex-col gap-3 text-center shadow-2xl">
    <div class="text-3xl font-black bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent select-none">⚡ BLIZ</div>
    <p class="text-[11px] text-gray-400">Plataforma de Videochat P2P Segura (+18)</p>

    <!-- Campos de fecha sin valores predefinidos -->
    <div class="flex gap-2 justify-center">
      <input type="text" id="inputDay" placeholder="Día" maxlength="2" inputmode="numeric" class="w-1/4 p-2 rounded-xl border border-gray-700 bg-[#0B0F19] text-white text-center text-xs outline-none">
      <input type="text" id="inputMonth" placeholder="Mes" maxlength="2" inputmode="numeric" class="w-1/4 p-2 rounded-xl border border-gray-700 bg-[#0B0F19] text-white text-center text-xs outline-none">
      <input type="text" id="inputYear" placeholder="Año" maxlength="4" inputmode="numeric" class="w-2/4 p-2 rounded-xl border border-gray-700 bg-[#0B0F19] text-white text-center text-xs outline-none">
    </div>

    <div class="flex items-center gap-2 text-left bg-gray-950 p-2.5 rounded-xl border border-gray-800">
      <input type="checkbox" id="acceptCheck" class="w-4 h-4 accent-cyan-500 cursor-pointer">
      <label for="acceptCheck" class="text-[10px] text-gray-300 leading-tight cursor-pointer">
        Soy mayor de 18 y acepto las <span class="text-cyan-400 underline font-semibold cursor-pointer" onclick="event.preventDefault();openLegalModal('terms')">Condiciones</span> y <span class="text-cyan-400 underline font-semibold cursor-pointer" onclick="event.preventDefault();openLegalModal('privacy')">Privacidad</span>.
      </label>
    </div>

    <button id="btnStartApp" type="button" class="w-full py-3 rounded-full font-bold text-white bg-gradient-to-r from-purple-600 to-cyan-500 hover:opacity-90 active:scale-95 transition shadow-lg cursor-pointer text-xs">
      Entrar a Bliz
    </button>
  </div>
</div>

<!-- VENTANA MODAL LEGAL -->
<div id="legalModal" class="hidden fixed inset-0 bg-black/90 z-[60] p-5 flex flex-col justify-center items-center">
  <div class="w-full max-w-sm bg-gray-900 border border-gray-800 rounded-2xl p-5 flex flex-col gap-3">
    <h3 id="legalTitle" class="text-sm font-bold text-cyan-400"></h3>
    <div id="legalContent" class="text-xs text-gray-300 max-h-60 overflow-y-auto leading-relaxed border-t border-b border-gray-800 py-3"></div>
    <button onclick="closeLegalModal()" class="w-full py-2 bg-gray-800 hover:bg-gray-700 text-white font-bold rounded-xl text-xs cursor-pointer">Entendido</button>
  </div>
</div>

<!-- HEADER PRINCIPAL -->
<header class="flex-none flex justify-between items-center px-4 py-2.5 bg-gray-900 border-b border-gray-800">
  <div class="flex items-center gap-2">
    <div class="text-xl font-black bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent">⚡ BLIZ</div>
    <div class="flex items-center gap-1 bg-emerald-950/60 border border-emerald-500/40 px-2 py-0.5 rounded-full text-[10px] font-medium text-emerald-400">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
      <span id="onlineCount">1</span> online
    </div>
  </div>
</header>

<!-- BARRA DE FILTROS -->
<div class="flex-none flex items-center justify-between gap-2 px-3 py-1.5 bg-[#131B2A] border-b border-gray-800">
  <div class="flex flex-1 items-center gap-1.5">
    <span class="text-[11px] text-gray-400 font-semibold whitespace-nowrap">🌐 País:</span>
    <select id="countrySelect" class="flex-1 p-1 rounded-lg border border-gray-700 bg-[#0B0F19] text-white text-xs outline-none">
      <option value="GLOBAL">🌍 Todos</option>
      <option value="ES">🇪🇸 España</option>
      <option value="MX">🇲🇽 México</option>
      <option value="CO">🇨🇴 Colombia</option>
      <option value="AR">🇦🇷 Argentina</option>
    </select>
  </div>
  <div class="flex flex-1 items-center gap-1.5">
    <span class="text-[11px] text-gray-400 font-semibold whitespace-nowrap">👤 Mi Género:</span>
    <select id="myGenderSelect" class="flex-1 p-1 rounded-lg border border-gray-700 bg-[#0B0F19] text-white text-xs outline-none">
      <option value="MALE">👨 Hombre</option>
      <option value="FEMALE">👩 Mujer</option>
      <option value="GROUP">👥 Grupo</option>
    </select>
  </div>
</div>

<!-- MAIN VIDEO CONTAINER -->
<main class="flex-1 flex flex-col min-h-0 relative p-2 gap-2">
  <div id="swipeArea" class="flex-1 min-h-0 relative bg-black rounded-2xl overflow-hidden border border-gray-800 flex justify-center items-center">
    
    <video id="remoteVideo" autoplay playsinline class="absolute inset-0 w-full h-full object-cover z-0 bg-gray-950"></video>

    <!-- ETIQUETA DE PAÍS DEL USUARIO REMOTO -->
    <div id="remoteCountryBadge" class="hidden absolute top-3 left-3 bg-black/60 backdrop-blur-md border border-white/20 text-white px-3 py-1 rounded-full text-xs font-semibold z-20 flex items-center gap-1.5">
      <span id="remoteFlag">🌍</span> <span id="remoteCountryName">Cargando...</span>
    </div>

    <div id="searchState" class="z-10 text-center text-gray-400 pointer-events-none">
      <div class="text-4xl animate-bounce">🔍</div>
      <p class="mt-2 text-xs font-medium" id="searchText">Buscando usuario en línea...</p>
      <p class="text-[10px] text-gray-500 mt-1">Toca Siguiente para cambiar de persona</p>
    </div>

    <!-- CONTROLES FLOTANTES -->
    <div class="absolute top-14 left-2.5 flex flex-col gap-2 z-20">
      <button id="btnMic" class="w-8 h-8 rounded-full bg-gray-900/80 border border-white/20 text-white flex justify-center items-center text-xs backdrop-blur cursor-pointer">🎤</button>
      <button id="btnCam" class="w-8 h-8 rounded-full bg-gray-900/80 border border-white/20 text-white flex justify-center items-center text-xs backdrop-blur cursor-pointer">📹</button>
      <button id="btnFlipCam" class="w-8 h-8 rounded-full bg-gray-900/80 border border-white/20 text-white flex justify-center items-center text-xs backdrop-blur cursor-pointer">🔄</button>
      <button id="btnBeauty" class="w-8 h-8 rounded-full bg-gray-900/80 border border-white/20 text-white flex justify-center items-center text-xs backdrop-blur cursor-pointer">✨</button>
    </div>

    <!-- CÁMARA PROPIA -->
    <div class="absolute top-2.5 right-2.5 w-20 h-28 rounded-xl overflow-hidden border-2 border-purple-500 z-20 shadow-lg bg-gray-900">
      <video id="selfCamera" autoplay playsinline muted class="w-full h-full object-cover transition-all"></video>
      <div id="micOffBadge" class="hidden absolute bottom-1 right-1 bg-red-600/90 text-white text-[9px] px-1 py-0.5 rounded backdrop-blur">🔇</div>
    </div>

    <!-- CHAT OVERLAY -->
    <div class="absolute bottom-2.5 left-2.5 right-2.5 flex flex-col gap-1.5 z-20 pointer-events-auto">
      <div id="chatMsgs" class="max-h-16 overflow-y-auto flex flex-col gap-1 pointer-events-none">
        <div class="bg-gray-900/80 backdrop-blur px-2.5 py-0.5 rounded-xl text-[10px] max-w-[85%] border border-white/10">
          <strong class="text-purple-400">Sistema:</strong> Conectado a Bliz. Respeto obligatorio.
        </div>
      </div>

      <div class="flex gap-1.5">
        <button onclick="sendEmoji('❤️')" class="bg-gray-900/80 border border-white/15 rounded-xl px-2 py-0.5 text-sm active:scale-90 transition cursor-pointer">❤️</button>
        <button onclick="sendEmoji('😂')" class="bg-gray-900/80 border border-white/15 rounded-xl px-2 py-0.5 text-sm active:scale-90 transition cursor-pointer">😂</button>
        <button onclick="sendEmoji('🔥')" class="bg-gray-900/80 border border-white/15 rounded-xl px-2 py-0.5 text-sm active:scale-90 transition cursor-pointer">🔥</button>
        <button onclick="sendEmoji('👎')" class="bg-gray-900/80 border border-white/15 rounded-xl px-2 py-0.5 text-sm active:scale-90 transition cursor-pointer">👎</button>
        <button onclick="sendEmoji('👋')" class="bg-gray-900/80 border border-white/15 rounded-xl px-2 py-0.5 text-sm active:scale-90 transition cursor-pointer">👋</button>
      </div>

      <div class="flex gap-1.5">
        <input type="text" id="chatInput" placeholder="Escribe un mensaje..." maxlength="200" autocomplete="off" class="flex-1 px-3 py-1.5 rounded-full border border-gray-700 bg-gray-950/85 text-white text-xs outline-none focus:border-cyan-500">
      </div>
    </div>
  </div>

  <!-- BOTONES INFERIORES -->
  <div class="flex-none flex gap-2 pb-1">
    <button id="blockBtn" class="flex-1 py-2.5 rounded-full font-bold text-xs text-white bg-red-900/80 border border-red-700 hover:bg-red-800 active:scale-95 transition cursor-pointer">🚫 Bloquear</button>
    <button id="reportBtn" class="flex-1 py-2.5 rounded-full font-bold text-xs text-white bg-gray-800 border border-gray-700 hover:bg-gray-700 active:scale-95 transition cursor-pointer">⚠️ Reportar</button>
    <button id="nextBtn" onclick="nextUser()" class="flex-1 py-2.5 rounded-full font-bold text-xs text-white bg-gradient-to-r from-purple-600 to-cyan-500 hover:opacity-90 active:scale-95 transition cursor-pointer">Siguiente ➔</button>
  </div>
</main>

<script>
// ===== CONFIGURACIÓN DE SUPABASE: pega tu clave en la 2ª línea =====
const SUPABASE_URL = 'https://zcdgnzbegusizsxozfrr.supabase.co';
const SUPABASE_KEY = 'PEGA_AQUI_TU_CLAVE';
// ====================================================================
const supabaseClient = (typeof supabase !== 'undefined' && !SUPABASE_KEY.startsWith('PEGA'))
    ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const $ = id => document.getElementById(id);
const ALLOWED_EMOJIS = ['❤️', '😂', '🔥', '👎', '👋'];

let localStream = null;
let peer = null;
let myPeerId = null;
let activeCall = null;
let dataConn = null;
let connected = false;
let currentFacingMode = 'user';
let beautyOn = false;
let blockedPeers = [];
let lastSkipTime = 0;
let searchTimer = null;
let callTimer = null;

/* ---------- LEGAL ---------- */
function openLegalModal(type) {
    const modal = $('legalModal');
    if (type === 'terms') {
        $('legalTitle').innerText = "Términos y Condiciones de Uso";
        $('legalContent').innerText = "1. Bliz es un servicio exclusivo para mayores de 18 años.\n2. Prohibido acoso, desnudez o contenido inadecuado.\n3. Suspensión permanente por violaciones a las reglas.";
    } else {
        $('legalTitle').innerText = "Política de Privacidad";
        $('legalContent').innerText = "1. Conexiones directas cifradas P2P entre dispositivos.\n2. No grabamos ni almacenamos videollamadas en servidores.";
    }
    modal.style.display = 'flex';
}
function closeLegalModal() { $('legalModal').style.display = 'none'; }

function showModAlert(text) {
    $('modBannerText').innerText = text;
    $('modBanner').style.display = 'flex';
    setTimeout(() => { $('modBanner').style.display = 'none'; }, 3500);
}

/* ---------- ENTRADA (+18 REAL) ---------- */
function isAdult(d, m, y) {
    if (!(y >= 1900 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) return null; // fecha inválida
    const bd = new Date(y, m - 1, d);
    if (bd.getMonth() !== m - 1 || bd.getDate() !== d) return null;
    const now = new Date();
    if (bd > now) return null;
    let age = now.getFullYear() - y;
    if (now < new Date(now.getFullYear(), m - 1, d)) age--;
    return age >= 18;
}

$('btnStartApp').onclick = function() {
    if (!$('acceptCheck').checked) {
        alert("Debes aceptar los Términos y la Política de Privacidad.");
        return;
    }
    const d = parseInt($('inputDay').value, 10);
    const m = parseInt($('inputMonth').value, 10);
    const y = parseInt($('inputYear').value, 10);
    if (isNaN(d) || isNaN(m) || isNaN(y)) {
        alert("Por favor, introduce tu fecha de nacimiento completa.");
        return;
    }
    const adult = isAdult(d, m, y);
    if (adult === null) { alert("Introduce una fecha de nacimiento válida."); return; }
    if (!adult) { alert("Debes tener al menos 18 años para utilizar Bliz."); return; }

    const authScreen = $('authScreen');
    authScreen.style.display = 'none';

    navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: true })
    .then(function(stream) {
        localStream = stream;
        $('selfCamera').srcObject = stream;
        initPeerConnection();
        showModAlert("🛡️ Moderación Activa: Cuentas reportadas serán suspendidas.");
    })
    .catch(function(err) {
        alert("Por favor, permite el acceso a la cámara y micrófono (la web debe abrirse con https).");
        authScreen.style.display = 'flex';
    });
};

/* ---------- PEERJS ---------- */
function initPeerConnection() {
    if (typeof Peer === 'undefined') return;
    peer = new Peer({
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        }
    });

    peer.on('open', id => {
        myPeerId = id;
        registerInSupabase(id);
        setInterval(() => registerInSupabase(myPeerId), 10000); // "latido": sigo conectado
        nextUser(true);
    });

    // Llamada entrante
    peer.on('call', call => {
        if (blockedPeers.includes(call.peer) || activeCall) { call.close(); return; }
        clearTimeout(searchTimer);
        call.answer(localStream);
        setupCall(call, "Conectado");
    });

    peer.on('connection', conn => {
        if (blockedPeers.includes(conn.peer)) { conn.close(); return; }
        setupData(conn);
    });

    peer.on('error', err => {
        console.warn("Peer error:", err);
        if (err.type === 'peer-unavailable') nextUser(true);
    });
    peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
}

function setupCall(call, label) {
    activeCall = call;
    connected = false;
    call.on('stream', remoteStream => {
        connected = true;
        clearTimeout(callTimer);
        $('remoteVideo').srcObject = remoteStream;
        $('searchState').style.display = 'none';
        showRemoteCountry("🌍", label);
    });
    const ended = () => {
        if (activeCall === call) { activeCall = null; connected = false; nextUser(true); }
    };
    call.on('close', ended);
    call.on('error', ended);
}

function setupData(conn) {
    dataConn = conn;
    conn.on('data', m => {
        if (!m || typeof m !== 'object') return;
        if (m.t === 'msg' && typeof m.v === 'string') addChat(m.v.slice(0, 200), false);
        else if (m.t === 'emoji' && ALLOWED_EMOJIS.includes(m.v)) floatEmoji(m.v);
        else if (m.t === 'report') showModAlert("⚠️ Aviso de Moderación: otro usuario te ha reportado.");
    });
}
function sendData(obj) { if (dataConn && dataConn.open) dataConn.send(obj); }

/* ---------- SUPABASE ---------- */
async function registerInSupabase(id) {
    if (!supabaseClient) return;
    try {
        await supabaseClient.from('active_users').upsert({
            id: id,
            gender: $('myGenderSelect').value,
            country: $('countrySelect').value,
            updated_at: new Date().toISOString()
        });
    } catch (e) { console.warn(e); }
}

function showRemoteCountry(flag, name) {
    $('remoteFlag').innerText = flag;
    $('remoteCountryName').innerText = name;
    $('remoteCountryBadge').style.display = 'flex';
}

/* ---------- BUSCAR / SIGUIENTE ---------- */
async function nextUser(force) {
    const now = Date.now();
    if (!force && now - lastSkipTime < 1200) {
        $('searchText').innerText = "Por favor, ve más despacio...";
        $('searchState').style.display = 'block';
        setTimeout(() => { $('searchText').innerText = "Buscando usuario en línea..."; }, 1000);
        return;
    }
    lastSkipTime = now;
    clearTimeout(searchTimer);
    clearTimeout(callTimer);

    const old = activeCall;
    activeCall = null; connected = false;
    if (old) { try { old.close(); } catch (e) {} }
    if (dataConn) { try { dataConn.close(); } catch (e) {} dataConn = null; }

    $('remoteVideo').srcObject = null;
    $('remoteCountryBadge').style.display = 'none';
    $('searchState').style.display = 'block';
    $('searchText').innerText = "Buscando usuario en línea...";

    if (!supabaseClient) {
        $('searchText').innerText = "Falta la clave de Supabase en el código.";
        return;
    }
    if (!myPeerId) return;

    await registerInSupabase(myPeerId);

    const selectedCountry = $('countrySelect').value;
    let query = supabaseClient
        .from('active_users')
        .select('*')
        .neq('id', myPeerId)
        .gt('updated_at', new Date(Date.now() - 30000).toISOString());
    if (selectedCountry && selectedCountry !== 'GLOBAL') query = query.eq('country', selectedCountry);

    const { data, error } = await query;
    if (error) console.error(error);
    if (activeCall) return; // mientras buscaba, alguien me llamó

    // Solo llama el de id menor: evita que dos personas se llamen a la vez
    const candidates = (data || []).filter(u => u.id > myPeerId && !blockedPeers.includes(u.id));
    $('onlineCount').innerText = (data ? data.length : 0) + 1;

    if (candidates.length > 0) {
        const target = candidates[Math.floor(Math.random() * candidates.length)];
        showRemoteCountry("🌐", `Conectando con ${target.country || 'Remoto'}`);
        const call = peer.call(target.id, localStream);
        setupCall(call, `Conectado (${target.country || 'Global'})`);
        setupData(peer.connect(target.id));
        callTimer = setTimeout(() => { if (!connected) nextUser(true); }, 10000);
        return;
    }

    // Nadie disponible: reintentar (o esperar a que alguien me llame)
    searchTimer = setTimeout(() => { if (!activeCall) nextUser(true); }, 3000);
}

/* ---------- CONTROLES ---------- */
$('btnMic').onclick = function() {
    if (!localStream) return;
    const track = localStream.getAudioTracks()[0];
    if (track) {
        track.enabled = !track.enabled;
        this.classList.toggle('bg-red-600', !track.enabled);
        $('micOffBadge').classList.toggle('hidden', track.enabled);
    }
};

$('btnCam').onclick = function() {
    if (!localStream) return;
    const track = localStream.getVideoTracks()[0];
    if (track) {
        track.enabled = !track.enabled;
        this.classList.toggle('bg-red-600', !track.enabled);
    }
};

$('btnFlipCam').onclick = function() {
    currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
    const oldTracks = localStream ? localStream.getTracks() : [];
    oldTracks.forEach(t => t.stop());
    navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: true })
    .then(stream => {
        localStream = stream;
        $('selfCamera').srcObject = stream;
        // Cambiar también lo que ve la otra persona
        if (activeCall && activeCall.peerConnection) {
            activeCall.peerConnection.getSenders().forEach(s => {
                if (!s.track) return;
                const nt = stream.getTracks().find(t => t.kind === s.track.kind);
                if (nt) s.replaceTrack(nt);
            });
        }
    })
    .catch(() => alert("No se pudo cambiar la cámara."));
};

$('btnBeauty').onclick = function() {
    beautyOn = !beautyOn;
    $('selfCamera').classList.toggle('beauty-active', beautyOn);
    this.classList.toggle('bg-purple-600', beautyOn);
};

$('blockBtn').onclick = function() {
    if (!activeCall) { showModAlert("No hay nadie conectado para bloquear."); return; }
    blockedPeers.push(activeCall.peer);
    showModAlert("🚫 Usuario bloqueado y desconectado.");
    nextUser(true);
};

$('reportBtn').onclick = async function() {
    if (!activeCall) { showModAlert("No hay nadie conectado para reportar."); return; }
    const reported = activeCall.peer;
    sendData({ t: 'report' });
    blockedPeers.push(reported);
    try {
        if (supabaseClient) await supabaseClient.from('reports').insert({ reported_peer: reported, reporter_peer: myPeerId });
    } catch (e) { console.warn(e); }
    showModAlert("⚠️ Reporte enviado al sistema de moderación. Gracias.");
    nextUser(true);
};

/* ---------- CHAT Y EMOJIS ---------- */
function addChat(text, mine) {
    const d = document.createElement('div');
    d.className = 'bg-gray-900/80 backdrop-blur px-2.5 py-0.5 rounded-xl text-[10px] max-w-[85%] border border-white/10 break-words';
    const who = document.createElement('strong');
    who.className = mine ? 'text-cyan-400' : 'text-purple-400';
    who.textContent = mine ? 'Tú: ' : 'Él/ella: ';
    d.appendChild(who);
    d.appendChild(document.createTextNode(text));
    const box = $('chatMsgs');
    box.appendChild
