<!DOCTYPE html>
<html lang="es">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0F19">
<title>Bliz - Videochat Global</title>

<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- PeerJS CDN -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
html, body { 
  background-color: #0B0F19; 
  color: #ffffff; 
  height: 100dvh; 
  width: 100vw; 
  display: flex; 
  flex-direction: column; 
  overflow: hidden; 
  touch-action: manipulation; 
}
.beauty-active { filter: brightness(1.12) contrast(1.05) saturate(1.1) blur(0.3px); }
.floating-emoji {
  position: absolute; bottom: 70px; right: 24px; font-size: 32px;
  animation: floatUp 1.8s ease-out forwards; z-index: 30; pointer-events: none;
}
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-130px) scale(1.5); }
}
</style>
</head>
<body class="flex flex-col h-[100dvh] w-full bg-[#0B0F19]">

<!-- PANTALLA INICIAL MEDIANTE FORMULARIO HTML NATIVO -->
<div id="authScreen" class="fixed inset-0 bg-[#0B0F19] z-50 flex flex-col justify-center items-center p-5 overflow-y-auto">
  <form onsubmit="handleEnter(event)" class="w-full max-w-sm bg-gray-900 border border-gray-800 rounded-3xl p-6 flex flex-col gap-4 text-center shadow-2xl">
    <div class="text-4xl font-black bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent select-none">⚡ BLIZ</div>
    <p class="text-xs text-gray-400">Plataforma de Videochat P2P Segura (+18)</p>

    <div class="flex gap-2 justify-center">
      <input type="text" id="inputDay" placeholder="Día" maxlength="2" inputmode="numeric" class="w-1/4 p-2.5 rounded-xl border border-gray-700 bg-[#0B0F19] text-white text-center text-xs outline-none" value="15">
      <input type="text" id="inputMonth" placeholder="Mes" maxlength="2" inputmode="numeric" class="w-1/4 p-2.5 rounded-xl border border-gray-700 bg-[#0B0F19] text-white text-center text-xs outline-none" value="06">
      <input type="text" id="inputYear" placeholder="Año" maxlength="4" inputmode="numeric" class="w-2/4 p-2.5 rounded-xl border border-gray-700 bg-[#0B0F19] text-white text-center text-xs outline-none" value="2000">
    </div>

    <div class="flex items-center justify-center gap-2 bg-gray-950 p-2.5 rounded-xl border border-gray-800">
      <input type="checkbox" id="acceptCheck" checked class="w-4 h-4 accent-cyan-500">
      <label for="acceptCheck" class="text-[10px] text-gray-300">Acepto Términos y Privacidad (+18)</label>
    </div>

    <button type="submit" class="w-full py-3.5 rounded-full font-bold text-white bg-gradient-to-r from-purple-600 to-cyan-500 hover:opacity-90 active:scale-95 transition shadow-lg cursor-pointer">
      Entrar a Bliz
    </button>
  </form>
</div>

<!-- HEADER CON CONTADOR ONLINE -->
<header class="flex-none flex justify-between items-center px-4 py-2.5 bg-gray-900 border-b border-gray-800">
  <div class="flex items-center gap-2">
    <div class="text-xl font-black bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent">⚡ BLIZ</div>
    <div class="flex items-center gap-1 bg-emerald-950/60 border border-emerald-500/40 px-2 py-0.5 rounded-full text-[10px] font-medium text-emerald-400">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
      <span id="onlineCount">1,248</span> online
    </div>
  </div>
</header>

<!-- BARRA DE FILTROS -->
<div class="flex-none flex items-center justify-between gap-2 px-3 py-1.5 bg-[#131B2A] border-b border-gray-800">
  <div class="flex flex-1 items-center gap-1.5">
    <span class="text-[11px] text-gray-400 font-semibold whitespace-nowrap">🌐 País:</span>
    <select class="flex-1 p-1 rounded-lg border border-gray-700 bg-[#0B0F19] text-white text-xs outline-none">
      <option value="GLOBAL">🌍 Todos los países</option>
    </select>
  </div>
  <div class="flex flex-1 items-center gap-1.5">
    <span class="text-[11px] text-gray-400 font-semibold whitespace-nowrap">👤 Buscar:</span>
    <select class="flex-1 p-1 rounded-lg border border-gray-700 bg-[#0B0F19] text-white text-xs outline-none">
      <option value="ALL">👫 Todos</option>
    </select>
  </div>
</div>

<!-- CONTENEDOR PRINCIPAL DE VÍDEO -->
<main class="flex-1 flex flex-col min-h-0 relative p-2 gap-2">
  <div id="swipeArea" class="flex-1 min-h-0 relative bg-black rounded-2xl overflow-hidden border border-gray-800 flex justify-center items-center">
    
    <video id="remoteVideo" autoplay playsinline class="absolute inset-0 w-full h-full object-cover z-0 bg-gray-950"></video>

    <div id="searchState" class="z-10 text-center text-gray-400 pointer-events-none">
      <div class="text-4xl animate-bounce">🔍</div>
      <p class="mt-2 text-xs font-medium">Buscando usuario en línea...</p>
    </div>

    <!-- CONTROLES CÁMARA -->
    <div class="absolute top-2.5 left-2.5 flex flex-col gap-2 z-20">
      <button id="btnMic" class="w-8 h-8 rounded-full bg-gray-900/80 border border-white/20 text-white flex justify-center items-center text-xs backdrop-blur">🎤</button>
      <button id="btnCam" class="w-8 h-8 rounded-full bg-gray-900/80 border border-white/20 text-white flex justify-center items-center text-xs backdrop-blur">📹</button>
      <button id="btnFlipCam" class="w-8 h-8 rounded-full bg-gray-900/80 border border-white/20 text-white flex justify-center items-center text-xs backdrop-blur">🔄</button>
      <button id="btnBeauty" class="w-8 h-8 rounded-full bg-gray-900/80 border border-white/20 text-white flex justify-center items-center text-xs backdrop-blur">✨</button>
    </div>

    <video id="selfCamera" autoplay playsinline muted class="absolute top-2.5 right-2.5 w-20 h-28 object-cover bg-gray-900 rounded-xl border-2 border-purple-500 z-20 transition-all"></video>

    <!-- CHAT OVERLAY -->
    <div class="absolute bottom-2.5 left-2.5 right-2.5 flex flex-col gap-1.5 z-20 pointer-events-auto">
      <div id="chatMsgs" class="max-h-16 overflow-y-auto flex flex-col gap-1 pointer-events-none">
        <div class="bg-gray-900/80 backdrop-blur px-2.5 py-0.5 rounded-xl text-[10px] max-w-[85%] border border-white/10">
          <strong class="text-purple-400">Sistema:</strong> Conectado a Bliz.
        </div>
      </div>
      <div class="flex gap-1.5">
        <input type="text" id="chatInput" placeholder="Escribe un mensaje..." autocomplete="off" class="flex-1 px-3 py-1.5 rounded-full border border-gray-700 bg-gray-950/85 text-white text-xs outline-none">
      </div>
    </div>
  </div>

  <!-- BOTONES INFERIORES -->
  <div class="flex-none flex gap-2 pb-1">
    <button id="blockBtn" class="flex-1 py-2.5 rounded-full font-bold text-xs text-white bg-red-900/80 border border-red-700">🚫 Bloquear</button>
    <button id="reportBtn" class="flex-1 py-2.5 rounded-full font-bold text-xs text-white bg-gray-800 border border-gray-700">⚠️ Reportar</button>
    <button id="nextBtn" class="flex-1 py-2.5 rounded-full font-bold text-xs text-white bg-gradient-to-r from-purple-600 to-cyan-500">Siguiente ➔</button>
  </div>
</main>

<script>
let localStream = null;
let peer = null;

// FUNCIÓN NATIVA VINCULADA AL FORMULARIO
function handleEnter(event) {
    event.preventDefault(); // Evita que recargue la página
    
    // Ocultar pantalla de acceso al instante
    var screen = document.getElementById('authScreen');
    if (screen) {
        screen.style.display = 'none';
        screen.remove(); // Lo elimina del DOM para liberar memoria
    }

    // Activar cámara del móvil
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true })
        .then(function(stream) {
            localStream = stream;
            var selfVid = document.getElementById('selfCamera');
            if(selfVid) selfVid.srcObject = stream;
        })
        .catch(function(err) {
            console.log("Permiso de cámara denegado o error:", err);
        });
    }

    // Iniciar red P2P PeerJS
    if (typeof Peer !== 'undefined') {
        try {
            peer = new Peer({
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });
        } catch(e) {
            console.log("PeerJS error:", e);
        }
    }
}

document.getElementById('nextBtn').onclick = function() {
    var remote = document.getElementById('remoteVideo');
    if(remote) remote.srcObject = null;
    var search = document.getElementById('searchState');
    if(search) search.style.display = 'block';
    setTimeout(function() {
        if(search) search.style.display = 'none';
    }, 1500);
};

document.getElementById('blockBtn').onclick = function() { alert("Usuario bloqueado."); };
document.getElementById('reportBtn').onclick = function() { alert("Reporte enviado."); };
</script>
</body>
</html>
