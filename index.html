<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bliz - Videochat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #111827; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; text-align: center; }
        .grid { display: flex; flex: 1; background: #000; position: relative; }
        .box { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; border: 1px solid #1f2937; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .status { position: absolute; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 20px; }
        .controls { background: #1f2937; padding: 20px; }
        button { background: #10b981; color: white; border: none; padding: 12px 30px; font-size: 1rem; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Bliz Video Chat</h2>
    <div class="grid">
        <div class="box">
            <video id="local-video" autoplay muted playsinline></video>
            <div class="status" style="bottom: 10px; left: 10px;">Tú</div>
        </div>
        <div class="box">
            <video id="remote-video" autoplay playsinline></video>
            <div id="loader" class="status">🔍 Buscando persona aleatoria...</div>
        </div>
    </div>
    <div class="controls">
        <button onclick="buscarPersona()">⏭️ Siguiente</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://zcdgnzbegusizsxozfrr.supabase.co';
        const SUPABASE_KEY = 'TU_PUBLISHABLE_KEY_AQUI'; // Pega tu clave real
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let localStream, peer, myPeerId;

        async function init() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video').srcObject = localStream;
            } catch (e) {
                alert("Permite el uso de cámara y micrófono.");
            }

            peer = new Peer();
            peer.on('open', (id) => {
                myPeerId = id;
                buscarPersona();
            });

            peer.on('call', (call) => {
                call.answer(localStream);
                call.on('stream', (remoteStream) => {
                    document.getElementById('remote-video').srcObject = remoteStream;
                    document.getElementById('loader').style.display = 'none';
                });
            });
        }

        async function buscarPersona() {
            document.getElementById('remote-video').srcObject = null;
            document.getElementById('loader').style.display = 'block';

            if (myPeerId) {
                await supabaseClient.from('active_users').upsert({
                    id: myPeerId,
                    gender: 'male',
                    country: 'ES',
                    updated_at: new Date()
                });
            }
        }

        window.addEventListener('beforeunload', () => {
            if (myPeerId) supabaseClient.from('active_users').delete().eq('id', myPeerId);
        });

        window.onload = init;
    </script>
</body>
</html>
