<!DOCTYPE html>
<html lang="es">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0F19">
<title>Bliz - Videochat Global</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- PeerJS -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
html, body { 
  background-color: #0B0F19; 
  color: #ffffff; 
  height: 100dvh; 
  width: 100vw; 
  display: flex; 
  flex-direction: column; 
  overflow: hidden; 
  touch-action: manipulation; 
}
.beauty-active { filter: brightness(1.12) contrast(1.05) saturate(1.1) blur(0.3px); }
.floating-emoji {
  position: absolute; bottom: 70px; right: 24px; font-size: 32px;
  animation: floatUp 1.8s ease-out forwards; z-index: 30; pointer-events: none;
}
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-130px) scale(1.5); }
}
@keyframes slideDown {
  0% { transform: translateY(-100%); opacity: 0; }
  100% { transform: translateY(0); opacity: 1; }
}
.animate-slide-down {
  animation: slideDown 0.3s ease-out forwards;
}
</style>
</head>
<body class="flex flex-col h-[100dvh] w-full bg-[#0B0F19]">

<!-- BANNER DE ALERTA DE MODERACIÓN -->
<div id="modBanner" class="hidden fixed top-0 left-0 right-0 z-50 bg-red-600/95 text-white text-xs px-4 py-2.5 text-center font-bold shadow-lg backdrop-blur animate-slide-down flex items-center justify-center gap-2">
  <span>⚠️</span> <span id="modBannerText">Aviso de Moderación: Comportamiento inadecuado detectado.</span>
</div>

<!-- PANTALLA INICIAL (+18 Y TÉRMINOS) -->
<div id="authScreen" class="fixed inset-0 bg-[#0B0F19] z-50 flex items-center justify-center p-4">
  <div class="w-full max-w-xs bg-gray-900 border border-gray-800 rounded-3xl p-5 flex flex-col gap-3 text-center shadow-2xl">
    <div class="text-3xl font-black bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent select-none">⚡ BLIZ</div>
    <p class="text-[11px] text-gray-400">Plataforma de Videochat P2P Segura (+18)</p>

    <!-- Campos de fecha sin valores predefinidos (vacíos para que el usuario los escriba) -->
    <div class="flex gap-2 justify-center">
      <input type="text" id="inputDay" placeholder="Día" maxlength="2" inputmode="numeric" class="w-1/4 p-2 rounded-xl border border-gray-700 bg-[#0B0F19] text-white text-center text-xs outline-none">
      <input type="text" id="inputMonth" placeholder="Mes" maxlength="2" inputmode="numeric" class="w-1/4 p-2 rounded-xl border border-gray-700 bg-[#0B0F19] text-white text-center text-xs outline-none">
      <input type="text" id="inputYear" placeholder="Año" maxlength="4" inputmode="numeric" class="w-2/4 p-2 rounded-xl border border-gray-700 bg-[#0B0F19] text-white text-center text-xs outline-none">
    </div>

    <div class="flex items-center gap-2 text-left bg-gray-950 p-2.5 rounded-xl border border-gray-800">
      <input type="checkbox" id="acceptCheck" checked class="w-4 h-4 accent-cyan-500 cursor-pointer">
      <label for="acceptCheck" class="text-[10px] text-gray-300 leading-tight cursor-pointer">
        Soy mayor de 18 y acepto las <span class="text-cyan-400 underline font-semibold cursor-pointer" onclick="openLegalModal('terms')">Condiciones</span> y <span class="text-cyan-400 underline font-semibold cursor-pointer" onclick="openLegalModal('privacy')">Privacidad</span>.
      </label>
    </div>

    <button id="btnStartApp" type="button" class="w-full py-3 rounded-full font-bold text-white bg-gradient-to-r from-purple-600 to-cyan-500 hover:opacity-90 active:scale-95 transition shadow-lg cursor-pointer text-xs">
      Entrar a Bliz
    </button>
  </div>
</div>

<!-- VENTANA MODAL LEGAL -->
<div id="legalModal" class="hidden fixed inset-0 bg-black/90 z-50 p-5 flex flex-col justify-center items-center">
  <div class="w-full max-w-sm bg-gray-900 border border-gray-800 rounded-2xl p-5 flex flex-col gap-3">
    <h3 id="legalTitle" class="text-sm font-bold text-cyan-400"></h3>
    <div id="legalContent" class="text-xs text-gray-300 max-h-60 overflow-y-auto leading-relaxed border-t border-b border-gray-800 py-3"></div>
    <button onclick="closeLegalModal()" class="w-full py-2 bg-gray-800 hover:bg-gray-700 text-white font-bold rounded-xl text-xs cursor-pointer">Entendido</button>
  </div>
</div>

<!-- HEADER PRINCIPAL -->
<header class="flex-none flex justify-between items-center px-4 py-2.5 bg-gray-900 border-b border-gray-800">
  <div class="flex items-center gap-2">
    <div class="text-xl font-black bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent">⚡ BLIZ</div>
    <div class="flex items-center gap-1 bg-emerald-950/60 border border-emerald-500/40 px-2 py-0.5 rounded-full text-[10px] font-medium text-emerald-400">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
      <span id="onlineCount">1,248</span> online
    </div>
  </div>
</header>

<!-- BARRA DE FILTROS -->
<div class="flex-none flex items-center justify-between gap-2 px-3 py-1.5 bg-[#131B2A] border-b border-gray-800">
  <div class="flex flex-1 items-center gap-1.5">
    <span class="text-[11px] text-gray-400 font-semibold whitespace-nowrap">🌐 País:</span>
    <select id="countrySelect" class="flex-1 p-1 rounded-lg border border-gray-700 bg-[#0B0F19] text-white text-xs outline-none">
      <option value="GLOBAL">🌍 Todos</option>
      <option value="ES">🇪🇸 España</option>
      <option value="MX">🇲🇽 México</option>
      <option value="CO">🇨🇴 Colombia</option>
      <option value="AR">🇦🇷 Argentina</option>
    </select>
  </div>
  <div class="flex flex-1 items-center gap-1.5">
    <span class="text-[11px] text-gray-400 font-semibold whitespace-nowrap">👤 Mi Género:</span>
    <select id="myGenderSelect" class="flex-1 p-1 rounded-lg border border-gray-700 bg-[#0B0F19] text-white text-xs outline-none">
      <option value="MALE">👨 Hombre</option>
      <option value="FEMALE">👩 Mujer</option>
      <option value="GROUP">👥 Grupo</option>
    </select>
  </div>
</div>

<!-- MAIN VIDEO CONTAINER -->
<main class="flex-1 flex flex-col min-h-0 relative p-2 gap-2">
  <div id="swipeArea" class="flex-1 min-h-0 relative bg-black rounded-2xl overflow-hidden border border-gray-800 flex justify-center items-center">
    
    <video id="remoteVideo" autoplay playsinline class="absolute inset-0 w-full h-full object-cover z-0 bg-gray-950"></video>

    <!-- ETIQUETA DE PAÍS DEL USUARIO REMOTO -->
    <div id="remoteCountryBadge" class="hidden absolute top-3 left-3 bg-black/60 backdrop-blur-md border border-white/20 text-white px-3 py-1 rounded-full text-xs font-semibold z-20 flex items-center gap-1.5">
      <span id="remoteFlag">🌍</span> <span id="remoteCountryName">Cargando...</span>
    </div>

    <div id="searchState" class="z-10 text-center text-gray-400 pointer-events-none">
      <div class="text-4xl animate-bounce">🔍</div>
      <p class="mt-2 text-xs font-medium" id="searchText">Buscando usuario en línea...</p>
      <p class="text-[10px] text-gray-500 mt-1">Desliza hacia arriba o toca Siguiente</p>
    </div>

    <!-- CONTROLES FLOTANTES -->
    <div class="absolute top-14 left-2.5 flex flex-col gap-2 z-20">
      <button id="btnMic" class="w-8 h-8 rounded-full bg-gray-900/80 border border-white/20 text-white flex justify-center items-center text-xs backdrop-blur cursor-pointer">🎤</button>
      <button id="btnCam" class="w-8 h-8 rounded-full bg-gray-900/80 border border-white/20 text-white flex justify-center items-center text-xs backdrop-blur cursor-pointer">📹</button>
      <button id="btnFlipCam" class="w-8 h-8 rounded-full bg-gray-900/80 border border-white/20 text-white flex justify-center items-center text-xs backdrop-blur cursor-pointer">🔄</button>
      <button id="btnBeauty" class="w-8 h-8 rounded-full bg-gray-900/80 border border-white/20 text-white flex justify-center items-center text-xs backdrop-blur cursor-pointer">✨</button>
    </div>

    <!-- CÁMARA PROPIA -->
    <div class="absolute top-2.5 right-2.5 w-20 h-28 rounded-xl overflow-hidden border-2 border-purple-500 z-20 shadow-lg bg-gray-900">
      <video id="selfCamera" autoplay playsinline muted class="w-full h-full object-cover transition-all"></video>
      <div id="micOffBadge" class="hidden absolute bottom-1 right-1 bg-red-600/90 text-white text-[9px] px-1 py-0.5 rounded backdrop-blur">🔇</div>
    </div>

    <!-- CHAT OVERLAY -->
    <div class="absolute bottom-2.5 left-2.5 right-2.5 flex flex-col gap-1.5 z-20 pointer-events-auto">
      <div id="chatMsgs" class="max-h-16 overflow-y-auto flex flex-col gap-1 pointer-events-none">
        <div class="bg-gray-900/80 backdrop-blur px-2.5 py-0.5 rounded-xl text-[10px] max-w-[85%] border border-white/10">
          <strong class="text-purple-400">Sistema:</strong> Conectado a Bliz. Respeto obligatorio.
        </div>
      </div>

      <div class="flex gap-1.5">
        <button onclick="sendEmoji('❤️')" class="bg-gray-900/80 border border-white/15 rounded-xl px-2 py-0.5 text-sm active:scale-90 transition cursor-pointer">❤️</button>
        <button onclick="sendEmoji('😂')" class="bg-gray-900/80 border border-white/15 rounded-xl px-2 py-0.5 text-sm active:scale-90 transition cursor-pointer">😂</button>
        <button onclick="sendEmoji('🔥')" class="bg-gray-900/80 border border-white/15 rounded-xl px-2 py-0.5 text-sm active:scale-90 transition cursor-pointer">🔥</button>
        <button onclick="sendEmoji('👎')" class="bg-gray-900/80 border border-white/15 rounded-xl px-2 py-0.5 text-sm active:scale-90 transition cursor-pointer">👎</button>
        <button onclick="sendEmoji('👋')" class="bg-gray-900/80 border border-white/15 rounded-xl px-2 py-0.5 text-sm active:scale-90 transition cursor-pointer">👋</button>
      </div>

      <div class="flex gap-1.5">
        <input type="text" id="chatInput" placeholder="Escribe un mensaje..." autocomplete="off" class="flex-1 px-3 py-1.5 rounded-full border border-gray-700 bg-gray-950/85 text-white text-xs outline-none focus:border-cyan-500">
      </div>
    </div>
  </div>

  <!-- BOTONES INFERIORES -->
  <div class="flex-none flex gap-2 pb-1">
    <button id="blockBtn" class="flex-1 py-2.5 rounded-full font-bold text-xs text-white bg-red-900/80 border border-red-700 hover:bg-red-800 active:scale-95 transition cursor-pointer">🚫 Bloquear</button>
    <button id="reportBtn" class="flex-1 py-2.5 rounded-full font-bold text-xs text-white bg-gray-800 border border-gray-700 hover:bg-gray-700 active:scale-95 transition cursor-pointer">⚠️ Reportar</button>
    <button id="nextBtn" onclick="nextUser()" class="flex-1 py-2.5 rounded-full font-bold text-xs text-white bg-gradient-to-r from-purple-600 to-cyan-500 hover:opacity-90 active:scale-95 transition cursor-pointer">Siguiente ➔</button>
  </div>
</main>

<script>
let localStream = null;
let peer = null;
let activeCall = null;
let currentFacingMode = 'user';
let beautyOn = false;
let blockedPeers = [];
let lastSkipTime = 0;

function openLegalModal(type) {
    const modal = document.getElementById('legalModal');
    const title = document.getElementById('legalTitle');
    const content = document.getElementById('legalContent');

    if (type === 'terms') {
        title.innerText = "Términos y Condiciones de Uso";
        content.innerText = "1. Bliz es un servicio exclusivo para mayores de 18 años.\n2. Prohibido acoso, desnudez o contenido inadecuado.\n3. Suspensión permanente por violaciones a las reglas.";
    } else {
        title.innerText = "Política de Privacidad";
        content.innerText = "1. Conexiones directas cifradas P2P entre dispositivos.\n2. No grabamos ni almacenamos videollamadas en servidores.";
    }
    modal.style.display = 'flex';
}

function closeLegalModal() {
    document.getElementById('legalModal').style.display = 'none';
}

function showModAlert(text) {
    const banner = document.getElementById('modBanner');
    const bannerText = document.getElementById('modBannerText');
    bannerText.innerText = text;
    banner.style.display = 'flex';
    setTimeout(() => {
        banner.style.display = 'none';
    }, 3500);
}

document.getElementById('btnStartApp').onclick = function() {
    const isChecked = document.getElementById('acceptCheck').checked;
    if (!isChecked) {
        alert("Debes aceptar los Términos y la Política de Privacidad.");
        return;
    }

    const dayVal = document.getElementById('inputDay').value.trim();
    const monthVal = document.getElementById('inputMonth').value.trim();
    const yearVal = parseInt(document.getElementById('inputYear').value, 10);
    const currentYear = new Date().getFullYear();

    if (!dayVal || !monthVal || isNaN(yearVal)) {
        alert("Por favor, introduce tu fecha de nacimiento completa.");
        return;
    }
    
    if (yearVal < 1900 || yearVal > currentYear) {
        alert("Por favor, introduce un año de nacimiento válido.");
        return;
    }

    if ((currentYear - yearVal) < 18) {
        alert("Debes tener al menos 18 años para utilizar Bliz.");
        return;
    }

    const authScreen = document.getElementById('authScreen');
    if (authScreen) {
        authScreen.style.display = 'none';
    }

    navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: true })
    .then(function(stream) {
        localStream = stream;
        document.getElementById('selfCamera').srcObject = stream;
        initPeerConnection();
        showModAlert("🛡️ Moderación Activa: Cuentas reportadas serán suspendidas.");
    })
    .catch(function(err) {
        alert("Por favor, permite el acceso a la cámara y micrófono.");
        if (authScreen) authScreen.style.display = 'flex';
    });
};

function initPeerConnection() {
    if (typeof Peer !== 'undefined') {
        peer = new Peer({
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        });

        peer.on('call', call => {
            if (blockedPeers.includes(call.peer)) { call.close(); return; }
            activeCall = call;
            call.answer(localStream);
            call.on('stream', remoteStream => {
                document.getElementById('remoteVideo').srcObject = remoteStream;
                document.getElementById('searchState').style.display = 'none';
                showRemoteCountry("🌍", "Conectado");
            });
        });
    }
}

function showRemoteCountry(flag, name) {
    document.getElementById('remoteFlag').innerText = flag;
    document.getElementById('remoteCountryName').innerText = name;
    document.getElementById('remoteCountryBadge').style.display = 'flex';
}

function nextUser() {
    const now = Date.now();
    if (now - lastSkipTime < 1200) {
        document.getElementById('searchText').innerText = "Por favor, ve más despacio...";
        document.getElementById('searchState').style.display = 'block';
        setTimeout(() => {
            document.getElementById('searchText').innerText = "Buscando usuario en línea...";
        }, 1000);
        return;
    }
    lastSkipTime = now;

    if (activeCall) {
        activeCall.close();
        activeCall = null;
    }
    document.getElementById('remoteVideo').srcObject = null;
    document.getElementById('remoteCountryBadge').style.display = 'none';
    document.getElementById('searchState').style.display = 'block';

    setTimeout(() => {
        document.getElementById('searchState').style.display = 'none';
        const randomCountries = [
            { flag: "🇪🇸", name: "España" },
            { flag: "🇲🇽", name: "México" },
            { flag: "🇦🇷", name: "Argentina" },
            { flag: "🇨🇴", name: "Colombia" }
        ];
        const picked = randomCountries[Math.floor(Math.random() * randomCountries.length)];
        showRemoteCountry(picked.flag, picked.name);
    }, 1500);
}

document.getElementById('btnMic').onclick = function() {
    if (localStream) {
        let track = localStream.getAudioTracks()[0];
        if (track) {
            track.enabled = !track.enabled;
            this.classList.toggle('bg-red-600', !track.enabled);
            document.getElementById('micOffBadge').classList.toggle('hidden', track.enabled);
        }
    }
};

document.getElementById('btnCam').onclick = function() {
    if (localStream) {
        let track = localStream.getVideoTracks()[0];
        if (track) {
            track.enabled = !track.enabled;
            this.classList.toggle('bg-red-600', !track.enabled);
        }
    }
};

document.getElementById('btnFlipCam').onclick = function() {
    currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    
    navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: true })
    .then(stream => {
        localStream = stream;
        document.getElementById('selfCamera').srcObject = stream;
    });
};

document.getElementById('btnBeauty').onclick = function() {
    beautyOn = !beautyOn;
    document.getElementById('selfCamera').classList.toggle('beauty-active', beautyOn);
    this.classList.toggle('bg-purple-600', beautyOn);
};

document.getElementById('blockBtn').onclick = function() {
    if (activeCall) blockedPeers.push(activeCall.peer);
    showModAlert("🚫 Usuario bloqueado y desconectado.");
    nextUser();
};

document.getElementById('reportBtn').onclick = function() { 
    showModAlert("⚠️ Reporte enviado al sistema de moderación. Gracias."); 
};

function sendEmoji(emoji) {
    if (emoji === '👎') {
        showModAlert("⚠️ Has enviado un reporte de contenido no deseado.");
    }
    let el = document.createElement('div');
    el.className = 'floating-emoji';
    el.innerText = emoji;
    document.getElementById('swipeArea').appendChild(el);
    setTimeout(() => el.remove(), 1800);
}
</script>
</body>
</html>
