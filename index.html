<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0B0F19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bliz - Videochat Global</title>

<link rel="manifest" href="data:application/manifest+json,{
%22name%22: %22Bliz Videochat%22,
%22short_name%22: %22Bliz%22,
%22start_url%22: %22./%22,
%22display%22: %22standalone%22,
%22background_color%22: %22%230B0F19%22,
%22theme_color%22: %22%230B0F19%22
}">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
body { background-color: #0B0F19; color: #ffffff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; touch-action: manipulation; }

/* PANTALLA INICIAL DE REGISTRO +18 */
#authScreen {
position: fixed; inset: 0; background: #0B0F19; z-index: 200;
display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;
}
.auth-card {
width: 100%; max-width: 330px; background: #111827; border: 1px solid #1E293B;
border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 14px; text-align: center;
box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}
.auth-title {
font-size: 34px; font-weight: 900;
background: linear-gradient(45deg, #06B6D4, #8B5CF6);
-webkit-background-clip: text; -webkit-text-fill-color: transparent;
cursor: pointer; /* Para indicar zona secreta */
}
.auth-sub { font-size: 12px; color: #9CA3AF; }

.date-container { display: flex; gap: 6px; justify-content: center; }
.date-select {
padding: 10px 4px; border-radius: 10px; border: 1px solid #374151;
background: #0B0F19; color: white; font-size: 13px; outline: none; text-align: center;
}
.day { width: 25%; } .month { width: 45%; } .year { width: 30%; }

.btn-auth {
padding: 12px; border-radius: 25px; border: none; font-weight: bold; cursor: pointer;
display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 14px;
}
.btn-gmail { background: #FFFFFF; color: #111827; }
.btn-phone { background: #1F2937; color: #FFFFFF; border: 1px solid #374151; }
.terms-text { font-size: 11px; color: #6B7280; line-height: 1.3; }

/* CABECERA & FILTROS */
header {
display: flex; justify-content: space-between; align-items: center;
padding: 12px 16px; background: #111827; border-bottom: 1px solid #1E293B;
}
.logo { 
font-size: 20px; font-weight: 900; background: linear-gradient(45deg, #06B6D4, #8B5CF6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
cursor: pointer;
}
.god-badge {
display: none; background: rgba(239, 68, 68, 0.2); color: #EF4444;
border: 1px solid #EF4444; padding: 4px 10px; border-radius: 15px; font-size: 11px; font-weight: bold; cursor: pointer;
}

.filter-bar {
display: flex; gap: 8px; padding: 8px 12px; background: #151D2A; border-bottom: 1px solid #1E293B;
justify-content: space-between; align-items: center;
}
.filter-group { display: flex; flex: 1; gap: 6px; align-items: center; }
.filter-label { font-size: 11px; color: #9CA3AF; font-weight: 600; white-space: nowrap; }
.filter-select {
flex: 1; padding: 6px 8px; border-radius: 8px; border: 1px solid #374151;
background: #0B0F19; color: #FFF; font-size: 12px; outline: none;
}

/* ÁREA PRINCIPAL DE VIDEOCHAT (P2P) */
.main-container { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.video-container {
flex: 1; position: relative; background: #000; margin: 8px;
border-radius: 20px; overflow: hidden; display: flex; justify-content: center; align-items: center; border: 1px solid #1E293B;
}

/* VÍDEO REMOTO (OCUPA TODO EL FONDO) */
#remoteVideo {
position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; background: #05050a;
}

#searchState { text-align: center; color: #9CA3AF; z-index: 3; pointer-events: none; position: absolute; }

/* MI CÁMARA FLOTANTE */
#selfCamera {
position: absolute; top: 12px; right: 12px; width: 95px; height: 135px;
object-fit: cover; background: #111827; border-radius: 14px; border: 2px solid #8B5CF6; z-index: 10;
transition: filter 0.3s ease;
}
.beauty-active { filter: brightness(1.1) contrast(1.05) saturate(1.1) blur(0.3px); }

.cam-controls {
position: absolute; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 8px; z-index: 10;
}
.icon-btn {
width: 36px; height: 36px; border-radius: 50%; background: rgba(17, 24, 39, 0.75);
border: 1px solid rgba(255,255,255,0.2); color: #fff; display: flex; justify-content: center;
align-items: center; font-size: 14px; cursor: pointer; backdrop-filter: blur(4px);
}
.icon-btn.active { background: #EF4444; border-color: #EF4444; }

/* OVERLAY CHAT Y TRADUCCIÓN */
.chat-overlay {
position: absolute; bottom: 12px; left: 12px; right: 12px; display: flex; flex-direction: column; gap: 8px; z-index: 10;
}
.chat-messages {
max-height: 90px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; pointer-events: none;
}
.chat-msg {
background: rgba(15, 23, 42, 0.75); padding: 5px 10px; border-radius: 12px; font-size: 11px;
max-width: 80%; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.08);
}
.chat-msg .translated { color: #06B6D4; font-size: 10px; display: block; margin-top: 2px; }

.emoji-bar { display: flex; gap: 8px; }
.emoji-btn {
background: rgba(17, 24, 39, 0.8); border: 1px solid rgba(255,255,255,0.15);
border-radius: 15px; padding: 4px 10px; font-size: 16px; cursor: pointer;
}

.chat-input-box { display: flex; gap: 6px; }
.chat-input {
flex: 1; padding: 8px 12px; border-radius: 20px; border: 1px solid #374151;
background: rgba(11, 15, 25, 0.85); color: #fff; font-size: 12px; outline: none;
}

.floating-emoji {
position: absolute; bottom: 60px; right: 20px; font-size: 28px;
animation: floatUp 1.8s ease-out forwards; z-index: 15; pointer-events: none;
}
@keyframes floatUp {
0% { opacity: 1; transform: translateY(0) scale(1); }
100% { opacity: 0; transform: translateY(-120px) scale(1.5); }
}

.controls { padding: 12px 16px; display: flex; gap: 10px; background: #111827; }
.btn { flex: 1; padding: 14px; border-radius: 25px; border: none; font-weight: bold; color: #fff; cursor: pointer; font-size: 15px; }
.btn-skip { background: #1F2937; border: 1px solid #374151; }
.btn-next { background: linear-gradient(135deg, #8B5CF6, #06B6D4); }

#godPanel { display: none; position: absolute; inset: 0; background: rgba(11,15,25,0.96); z-index: 100; padding: 15px; flex-direction: column; }
.god-header { display: flex; justify-content: space-between; color: #EF4444; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #EF4444; padding-bottom: 8px; }
#closeGod { background: #1F2937; color: #fff; border: none; padding: 4px 8px; border-radius: 5px; cursor: pointer; }
.ai-box { font-size: 11px; color: #C084FC; background: rgba(139,92,246,0.1); padding: 8px; border-radius: 6px; }
.feed-card { background: #111827; border: 1px solid #EF4444; border-radius: 10px; padding: 10px; margin-top: 10px; }
.btn-ban { width: 100%; background: #EF4444; color: #fff; border: none; padding: 8px; border-radius: 6px; margin-top: 8px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

</div>
