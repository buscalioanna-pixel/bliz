<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0B0F19">
<title>Bliz - Videochat Global</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- PeerJS -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
body { background-color: #0B0F19; color: #ffffff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; touch-action: manipulation; }
.beauty-active { filter: brightness(1.12) contrast(1.05) saturate(1.1) blur(0.3px); }
.floating-emoji {
  position: absolute; bottom: 70px; right: 24px; font-size: 32px;
  animation: floatUp 1.8s ease-out forwards; z-index: 30; pointer-events: none;
}
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-130px) scale(1.5); }
}
</style>
</head>
<body>

<!-- PANTALLA INICIAL (+18) -->
<div id="authScreen" class="fixed inset-0 bg-[#0B0F19] z-50 flex flex-col justify-center items-center p-5">
  <div class="w-full max-w-xs bg-gray-900 border border-gray-800 rounded-3xl p-6 flex flex-col gap-4 text-center shadow-2xl">
    <div id="secretLogoAuth" class="text-4xl font-black bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent cursor-pointer select-none">⚡ BLIZ</div>
    <p class="text-xs text-gray-400">Introduce tu año de nacimiento (+18)</p>

    <div class="flex gap-2 justify-center">
      <input type="text" id="inputDay" placeholder="Día" maxlength="2" inputmode="numeric" class="w-1/4 p-3 rounded-xl border border-gray-700 bg-[#0B0F19] text-white text-center text-sm outline-none focus:border-cyan-500">
      <input type="text" id="inputMonth" placeholder="Mes" maxlength="2" inputmode="numeric" class="w-1/4 p-3 rounded-xl border border-gray-700 bg-[#0B0F19] text-white text-center text-sm outline-none focus:border-cyan-500">
      <input type="text" id="inputYear" placeholder="Año" maxlength="4" inputmode="numeric" class="w-2/4 p-3 rounded-xl border border-gray-700 bg-[#0B0F19] text-white text-center text-sm outline-none focus:border-cyan-500">
    </div>

    <button id="btnEnter" class="w-full py-3.5 rounded-full font-bold text-white bg-gradient-to-r from-purple-600 to-cyan-500 hover:opacity-90 active:scale-95 transition">Entrar</button>

    <p class="text-[10px] text-gray-500 leading-tight">Al entrar confirmas que eres mayor de edad y aceptas el uso de la cámara para el videochat P2P.</p>
    <div class="flex justify-center gap-3 text-[10px] text-cyan-400 underline">
      <span class="cursor-pointer" onclick="alert('Bliz es una plataforma de comunicación P2P. Prohibido menores de 18 años.')">Términos</span>
      <span class="cursor-pointer" onclick="alert('Transmisiones cifradas de extremo a extremo.')">Privacidad</span>
    </div>
  </div>
</div>

<!-- HEADER -->
<header class="flex justify-between items-center px-4 py-3 bg-gray-900 border-b border-gray-800">
  <div id="secretLogoHeader" class="text-xl font-black bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent cursor-pointer">⚡ BLIZ</div>
  <div id="godBadge" class="hidden bg-red-950/60 text-red-400 border border-red-500 px-3 py-1 rounded-full text-xs font-bold cursor-pointer hover:bg-red-900/80">👑 MODO DIOS</div>
</header>

<!-- BARRA DE FILTROS -->
<div class="flex items-center justify-between gap-2 px-3 py-2 bg-[#131B2A] border-b border-gray-800">
  <div class="flex flex-1 items-center gap-1.5">
    <span class="text-[11px] text-gray-400 font-semibold whitespace-nowrap">🌐 País:</span>
    <select id="countrySelect" class="flex-1 p-1.5 rounded-lg border border-gray-700 bg-[#0B0F19] text-white text-xs outline-none">
      <option value="GLOBAL">🌍 Todos los países</option>
      <option value="ES">🇪🇸 España</option>
      <option value="MX">🇲🇽 México</option>
      <option value="CO">🇨🇴 Colombia</option>
      <option value="AR">🇦🇷 Argentina</option>
      <option value="CL">🇨🇱 Chile</option>
      <option value="PE">🇵🇪 Perú</option>
      <option value="US">🇺🇸 EE.UU.</option>
    </select>
  </div>
  <div class="flex flex-1 items-center gap-1.5">
    <span class="text-[11px] text-gray-400 font-semibold whitespace-nowrap">👤 Buscar:</span>
    <select id="genderSelect" class="flex-1 p-1.5 rounded-lg border border-gray-700 bg-[#0B0F19] text-white text-xs outline-none">
      <option value="ALL">👫 Todos</option>
      <option value="FEMALE">👩 Mujeres</option>
      <option value="MALE">👨 Hombres</option>
    </select>
  </div>
</div>

<!-- CONTENEDOR PRINCIPAL DE VÍDEO -->
<main class="flex-1 flex flex-col relative overflow-hidden p-2">
  <div id="swipeArea" class="flex-1 relative bg-black rounded-2xl overflow-hidden border border-gray-800 flex justify-center items-center">
    
    <video id="remoteVideo" autoplay playsinline class="absolute inset-0 w-full h-full object-cover z-0 bg-gray-950"></video>

    <div id="searchState" class="z-10 text-center text-gray-400 pointer-events-none">
      <div class="text-4xl animate-bounce">🔍</div>
      <p class="mt-2 text-xs font-medium">Buscando usuario en línea...</p>
      <p class="text-[10px] text-gray-500 mt-1">Desliza hacia arriba para omitir</p>
    </div>

    <!-- CONTROLES FLOTANTES -->
    <div class="absolute top-3 left-3 flex flex-col gap-2 z-20">
      <button id="btnMic" class="w-9 h-9 rounded-full bg-gray-900/80 border border-white/20 text-white flex justify-center items-center text-sm backdrop-blur">🎤</button>
      <button id="btnCam" class="w-9 h-9 rounded-full bg-gray-900/80 border border-white/20 text-white flex justify-center items-center text-sm backdrop-blur">📹</button>
      <button id="btnFlipCam" class="w-9 h-9 rounded-full bg-gray-900/80 border border-white/20 text-white flex justify-center items-center text-sm backdrop-blur">🔄</button>
      <button id="btnBeauty" class="w-9 h-9 rounded-full bg-gray-900/80 border border-white/20 text-white flex justify-center items-center text-sm backdrop-blur">✨</button>
    </div>

    <video id="selfCamera" autoplay playsinline muted class="absolute top-3 right-3 w-24 h-36 object-cover bg-gray-900 rounded-xl border-2 border-purple-500 z-20 transition-all"></video>

    <!-- CHAT OVERLAY -->
    <div class="absolute bottom-3 left-3 right-3 flex flex-col gap-2 z-20 pointer-events-auto">
      <div id="chatMsgs" class="max-h-24 overflow-y-auto flex flex-col gap-1 pointer-events-none">
        <div class="bg-gray-900/80 backdrop-blur px-2.5 py-1 rounded-xl text-[11px] max-w-[85%] border border-white/10">
          <strong class="text-purple-400">Sistema:</strong> Conectado a Bliz.
        </div>
      </div>

      <div class="flex gap-2">
        <button onclick="sendEmoji('❤️')" class="bg-gray-900/80 border border-white/15 rounded-xl px-2.5 py-1 text-base active:scale-90 transition">❤️</button>
        <button onclick="sendEmoji('😂')" class="bg-gray-900/80 border border-white/15 rounded-xl px-2.5 py-1 text-base active:scale-90 transition">😂</button>
        <button onclick="sendEmoji('🔥')" class="bg-gray-900/80 border border-white/15 rounded-xl px-2.5 py-1 text-base active:scale-90 transition">🔥</button>
        <button onclick="sendEmoji('👋')" class="bg-gray-900/80 border border-white/15 rounded-xl px-2.5 py-1 text-base active:scale-90 transition">👋</button>
      </div>
