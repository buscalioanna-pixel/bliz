<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bliz - Videochat Aleatorio</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: white; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; text-align: center; }
        header { background: #1e293b; padding: 15px; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #334155; color: #38bdf8; }
        .video-grid { display: flex; flex: 1; position: relative; background: #000; flex-wrap: wrap; }
        .video-box { flex: 1; min-width: 300px; position: relative; display: flex; justify-content: center; align-items: center; border: 1px solid #1e293b; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .overlay-status { position: absolute; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 20px; color: #fff; font-size: 1rem; }
        .controls { background: #1e293b; padding: 20px; border-top: 1px solid #334155; }
        .btn-next { background: #f43f5e; color: white; border: none; padding: 12px 30px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-next:hover { background: #e11d48; }
    </style>
</head>
<body>
    <header>Bliz - Chat de Vídeo Aleatorio</header>

    <div class="video-grid">
        <div class="video-box">
            <video id="local-video" autoplay muted playsinline></video>
            <span class="overlay-status" style="bottom: 15px; left: 15px;">Tú</span>
        </div>
        <div class="video-box">
            <video id="remote-video" autoplay playsinline></video>
            <div id="searching-loader" class="overlay-status">🔍 Buscando persona aleatoria...</div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-next" onclick="startSearch()">⏭️ Siguiente Persona</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://zcdgnzbegusizsxozfrr.supabase.co';
        const SUPABASE_KEY = 'TU_PUBLISHABLE_KEY_AQUI'; // Pega aquí tu Publishable key real de Supabase
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let localStream = null;
        let peer = null;
        let myPeerId = null;

        async function init() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video').srcObject = localStream;
            } catch (err) {
                alert("Es necesario dar permisos de cámara y micrófono para usar Bliz.");
            }

            peer = new Peer();

            peer.on('open', (id) => {
                myPeerId = id;
                startSearch();
            });

            peer.on('call', (call) => {
                call.answer(localStream);
                call.on('stream', (remoteStream) => {
                    document.getElementById('remote-video').srcObject = remoteStream;
                    document.getElementById('searching-loader').style.display = 'none';
                });
            });
        }

        async function startSearch() {
            document.getElementById('remote-video').srcObject = null;
            document.getElementById('searching-loader').style.display = 'block';

            if (myPeerId) {
                await supabaseClient.from('active_users').upsert({
                    id: myPeerId,
                    gender: 'male',
                    country: 'ES',
                    updated_at: new Date()
                });
            }
        }

        window.addEventListener('beforeunload', () => {
            if (myPeerId) {
                supabaseClient.from('active_users').delete().eq('id', myPeerId);
            }
        });

        window.onload = init;
    </script>
</body>
</html>
