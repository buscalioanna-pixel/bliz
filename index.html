<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bliz</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
  body { background-color: #0B0F19; color: #ffffff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #authScreen { position: fixed; inset: 0; background: #0B0F19; z-index: 9999; display: flex; justify-content: center; align-items: center; padding: 20px; }
  .card { background: #111827; border: 1px solid #1f2937; border-radius: 20px; padding: 24px; width: 100%; max-width: 320px; text-align: center; }
  h1 { font-size: 28px; font-weight: 900; background: linear-gradient(to right, #22d3ee, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
  p { font-size: 12px; color: #9ca3af; margin-bottom: 16px; }
  .btn { width: 100%; padding: 14px; border: none; border-radius: 99px; font-weight: bold; color: white; background: linear-gradient(to right, #9333ea, #06b6d4); cursor: pointer; font-size: 14px; margin-top: 15px; }
  .main-app { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
  video { width: 100%; height: 100%; object-fit: cover; background: #111; }
  .top-cam { position: absolute; top: 10px; right: 10px; width: 80px; height: 110px; border-radius: 10px; border: 2px solid #a855f7; object-fit: cover; }
  .controls { padding: 10px; display: flex; gap: 10px; background: #0b0f19; }
  .controls button { flex: 1; padding: 12px; border-radius: 99px; border: none; font-weight: bold; color: white; background: #374151; font-size: 12px; cursor: pointer; }
  .controls button.next { background: linear-gradient(to right, #9333ea, #06b6d4); }
</style>
</head>
<body>

<!-- PANTALLA DE ACCESO -->
<div id="authScreen">
  <div class="card">
    <h1>⚡ BLIZ</h1>
    <p>Videochat P2P Seguro (+18)</p>
    
    <div style="text-align: left; font-size: 11px; color: #d1d5db; margin-bottom: 15px; background: #030712; padding: 10px; border-radius: 8px;">
      <input type="checkbox" id="cbox" checked> Acepto Términos y Privacidad (+18)
    </div>

    <button class="btn" onclick="forceEnter()">Entrar a Bliz</button>
  </div>
</div>

<!-- APLICACIÓN PRINCIPAL -->
<div class="main-app">
  <div style="position: relative; flex: 1; overflow: hidden;">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="selfCamera" autoplay playsinline muted class="top-cam"></video>
  </div>
  
  <div class="controls">
    <button onclick="alert('Bloqueado')">Bloquear</button>
    <button onclick="alert('Reportado')">Reportar</button>
    <button class="next" onclick="alert('Siguiente usuario')">Siguiente ➔</button>
  </div>
</div>

<script>
function forceEnter() {
    var chk = document.getElementById('cbox');
    if (chk && !chk.checked) {
        alert("Debes aceptar los términos.");
        return;
    }

    // Ocultar pantalla de acceso de inmediato por fuerza bruta CSS
    var screen = document.getElementById('authScreen');
    if (screen) {
        screen.style.cssText = "display: none !important;";
    }

    // Activar cámara frontal directamente
    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
    .then(function(stream) {
        var selfVid = document.getElementById('selfCamera');
        if (selfVid) {
            selfVid.srcObject = stream;
        }
    })
    .catch(function(error) {
        alert("Aviso: No se pudo iniciar la cámara (" + error.message + "). La app continuará abierta.");
    });
}
</script>

</body>
</html>
