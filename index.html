<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bliz - Video Chat Cliente</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 20px; }
        .container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .video-box { background: #1e293b; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        video { width: 320px; height: 240px; background: #000; border-radius: 8px; object-fit: cover; }
        #status { font-weight: bold; padding: 5px 10px; border-radius: 4px; display: inline-block; }
        .online { background: #166534; color: #dcfce7; }
        .offline { background: #991b1b; color: #fee2e2; }
    </style>
</head>
<body>
    <h1>Bliz Video Chat</h1>
    <p>Estado de Conexión: <span id="status" class="offline">Desconectado</span></p>
    <p>Tu ID de Peer: <span id="peer-id" style="color: #38bdf8;">Generando...</span></p>

    <div class="container">
        <div class="video-box">
            <h3>Tu Cámara</h3>
            <video id="local-video" autoplay muted playsinline></video>
        </div>
        <div class="video-box">
            <h3>Remoto / Moderador</h3>
            <video id="remote-video" autoplay playsinline></video>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zcdgnzbegusizsxozfrr.supabase.co';
        const SUPABASE_KEY = 'TU_PUBLISHABLE_KEY_AQUI'; // Reemplaza con tu clave real
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let localStream = null;
        let peer = null;
        let heartbeatInterval = null;
        let myPeerId = null;

        async function initMedia() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video').srcObject = localStream;
            } catch (err) {
                console.error("Error al obtener permisos de medios:", err);
                alert("Debes permitir el acceso a la cámara y micrófono para usar Bliz.");
            }
        }

        function initPeer() {
            peer = new Peer();

            peer.on('open', async (id) => {
                myPeerId = id;
                document.getElementById('peer-id').innerText = id;
                document.getElementById('status').innerText = 'En Línea';
                document.getElementById('status').className = 'online';

                await registerUser(id);
                startHeartbeat(id);
            });

            peer.on('call', (call) => {
                if (!localStream) {
                    alert("No hay flujo de medios local disponible para responder.");
                    return;
                }
                call.answer(localStream);
                call.on('stream', (remoteStream) => {
                    document.getElementById('remote-video').srcObject = remoteStream;
                });
                call.on('error', (err) => {
                    console.error("Error en la llamada P2P:", err);
                });
            });

            peer.on('disconnected', () => {
                document.getElementById('status').innerText = 'Desconectado (Reintentando...)';
                document.getElementById('status').className = 'offline';
                peer.reconnect();
            });
        }

        async function registerUser(id) {
            const { error } = await supabaseClient.from('active_users').upsert({
                id: id,
                gender: 'male', // Personalizable según tu app
                country: 'ES',  // Personalizable según tu app
                updated_at: new Date()
            });
            if (error) console.error("Error al registrar en Supabase:", error);
        }

        function startHeartbeat(id) {
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(async () => {
                const { error } = await supabaseClient.from('active_users').update({
                    updated_at: new Date()
                }).eq('id', id);
                if (error) console.error("Error en el latido (heartbeat):", error);
            }, 10000);
        }

        // Limpieza robusta al cerrar o recargar la pestaña
        window.addEventListener('beforeunload', () => {
            if (myPeerId) {
                // Usamos fetch síncrono o keepalive para asegurar el borrado antes de cerrar
                supabaseClient.from('active_users').delete().eq('id', myPeerId);
            }
        });

        // Inicialización general
        window.addEventListener('DOMContentLoaded', async () => {
            await initMedia();
            initPeer();
        });
    </script>
</body>
</html>
